name: Examples

# Checks the example .ttl files on every pull request and push. On master it also
# publishes the examples-index branch that the SPARQL editor reads: index.json,
# history.json, a snapshot per version, the combined Turtle file and .rq exports.
# The tools come from wikipathways/Snorql-UI (tools/examples).

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

jobs:
  examples:
    uses: wikipathways/Snorql-UI/.github/workflows/examples-index.yml@d91edd480c55ea7c3e65e2e891a0de323c9b97a2  # v1.5.1
    with:
      tools-ref: d91edd480c55ea7c3e65e2e891a0de323c9b97a2  # v1.5.1
      publish: ${{ github.event_name != 'pull_request' }}
      sib-project: PlantMetWiki
    permissions:
      contents: write
