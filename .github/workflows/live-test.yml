name: Live test

# Runs every example against the PlantMetWiki SPARQL endpoint once a week and
# checks the expected number of results (snorql:expect). A failing run means a
# query broke, an endpoint it federates with is down, or the data changed. An
# example whose query returns an error fails too. Two do so today, so the run
# is red until they are fixed: PMWQ019 (Pathway_Content_Summary, over Virtuoso's
# time estimate) and PMWQ036 (SMILES_from_Wikidata, QLever errors). The federated
# PMWQ033 and PMWQ035 fail now and then when a remote endpoint is busy.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wikipathways/Snorql-UI
          ref: d91edd480c55ea7c3e65e2e891a0de323c9b97a2  # v1.5.1
          path: .snorql-tools
          sparse-checkout: tools/examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .snorql-tools/tools/examples/requirements.txt
      - name: Run the examples
        run: python .snorql-tools/tools/examples/snorql_examples.py live --timeout 150
